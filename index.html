<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBEFE3">
<title>Be Samiliar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap">
<style>
/* Layout: 모바일 세로 한 열(최대 440px), 하단 탭 3개 고정. 라이트 단일 테마(design.md 기준). */
:root{
  --point:#DB4E18; --sub:#E88D14; --highlight:#F3BE26; --wrong:#AD1B02; --correct:#1E7B4F;
  --avatar-pink:#E669A2; --text:#1A1A1A; --bg-soft:#F5F5F5; --muted:#666666;
  --line-card:#E3E3E3; --line-input:#B8B8B8; --tab-off:#8A8A8A; --white:#FFFFFF;
  --font:"Pretendard","Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --serif:"Playfair Display",Georgia,"Times New Roman",serif;
  --gutter:18px; --tabh:64px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{min-height:100%}
body{margin:0;min-height:100%;font-family:var(--font);color:var(--text);font-size:16px;line-height:1.5;
  background:var(--white) linear-gradient(180deg,rgba(232,141,20,.17) 0%,#FFFFFF 50%,rgba(243,190,38,.20) 100%) fixed;-webkit-font-smoothing:antialiased}
.shell{display:flex;justify-content:center}
.app{width:100%;max-width:440px;min-height:100%;position:relative;padding:0 var(--gutter);padding-block:20px calc(var(--tabh) + 28px)}
.app.notab{padding-bottom:28px}
button,input,select,textarea{font-family:inherit;font-size:16px;color:var(--text)}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--point);outline-offset:2px}
h1,h2,p{margin:0}
.screen{display:flex;flex-direction:column;gap:24px}
.caption{font-size:14px;color:var(--muted)}
.label{font-size:15px;font-weight:600}
.h-screen{font-size:24px;font-weight:700;line-height:1.3}
.topbar{display:flex;align-items:center;gap:8px;min-height:44px}
.iconbtn{width:44px;height:44px;border:0;background:transparent;border-radius:12px;display:grid;place-items:center;margin-left:-10px;flex:none}
.iconbtn svg{width:24px;height:24px}

/* 홈 */
.brand-logo{height:26px;width:auto;display:block;align-self:flex-start}
.title{font-family:var(--serif);font-weight:700;font-size:40px;line-height:1.1;letter-spacing:-.01em}
.title .samil{color:var(--point)}
.status{font-size:24px;font-weight:700;line-height:1.35;text-wrap:balance}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:14px;font-weight:700}
.dot{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line-input);display:grid;place-items:center;background:var(--white)}
.dot.done{background:var(--point);border-color:var(--point);color:var(--white)}
.dot.today{box-shadow:0 0 0 3px var(--highlight)}
.dot svg{width:18px;height:18px}
.mastery{display:flex;align-items:center;gap:18px}
.donut{width:112px;height:112px;flex:none;position:relative}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut .pct{position:absolute;inset:0;display:grid;place-items:center;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.donut .arc{transition:stroke-dashoffset .6s ease-out}
.mastery p{font-size:16px;line-height:1.5}
.mastery strong{font-size:20px}
.card{background:var(--white);border:1px solid var(--line-card);border-radius:14px;padding:16px}
.review{display:flex;flex-direction:column;gap:12px}
.faces{display:flex;align-items:center}
.faces .av{margin-right:-10px;border:2px solid var(--white)}

.tappable{width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.tappable:active{background:var(--bg-soft)}
.review-head{display:flex;align-items:center;justify-content:space-between}
.chev{width:22px;height:22px;color:var(--muted)} .chev svg{width:100%;height:100%;display:block}
.sheet{max-height:86vh}
.sheet > .btn,.sheet > .row2{flex:none}
.lowlist{display:flex;flex-direction:column;overflow-y:auto;margin:0 calc(-1 * var(--gutter));padding:0 var(--gutter);min-height:0}
.lowrow{display:flex;align-items:center;gap:12px;padding:10px 0;border:0;border-bottom:1px solid var(--line-card);background:transparent;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.lowrow:active{background:var(--bg-soft)}
.lowrow .who{display:flex;flex-direction:column}
.lowrow .chev{width:18px;height:18px;flex:none}
.lowrow:last-child{border-bottom:0}
.lowrow .who{flex:1;min-width:0}
.lowrow .nm{font-weight:700}
.lowrow .memo{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rate{font-weight:700;font-size:18px;color:var(--wrong);text-align:right;display:flex;flex-direction:column;font-variant-numeric:tabular-nums;flex:none}
.rate small{font-size:13px;font-weight:400;color:var(--muted)}
/* 아바타 */
.av{border-radius:50%;overflow:hidden;flex:none;display:block;background:var(--bg-soft)}
.av svg,.av img{width:100%;height:100%;display:block;object-fit:cover}

/* 칩 */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * var(--gutter));padding:2px var(--gutter)}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 16px;border-radius:9999px;border:1.5px solid var(--line-input);background:var(--white);font-size:15px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--point);border-color:var(--point);color:var(--white)}
.chip.off{opacity:.38}

/* 입력 */
.field{display:flex;flex-direction:column;gap:6px}
.input{width:100%;height:48px;border:1.5px solid var(--line-input);border-radius:12px;padding:0 14px;background:var(--white);outline:none}
.input:focus{border:2px solid var(--point);padding:0 13.5px}
textarea.input{height:84px;padding:12px 14px;resize:none}
textarea.input:focus{padding:11.5px 13.5px}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted)}
.search .input{padding-left:42px}
.search .input:focus{padding-left:41.5px}

/* 버튼 */
.btn{height:52px;border-radius:14px;font-size:18px;font-weight:600;width:100%;border:1.5px solid var(--text);background:var(--white);display:flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--point);border-color:var(--point);color:var(--white)}
.btn.focus{color:var(--point);border-color:var(--point)}
.btn:disabled{opacity:.4;cursor:default}
.btn.import{height:48px;font-size:16px;font-weight:600;border:1.5px solid transparent;
  background:linear-gradient(180deg,rgba(232,141,20,.17) 0%,#FFFFFF 50%,rgba(243,190,38,.20) 100%) padding-box,
             linear-gradient(#FFFFFF,#FFFFFF) padding-box,
             linear-gradient(90deg,var(--point),var(--sub),var(--highlight)) border-box}
.btn.import:active{background:linear-gradient(180deg,rgba(232,141,20,.30) 0%,#FFFFFF 50%,rgba(243,190,38,.32) 100%) padding-box,
             linear-gradient(#FFFFFF,#FFFFFF) padding-box,
             linear-gradient(90deg,var(--point),var(--sub),var(--highlight)) border-box}
.btn.import.li{background:linear-gradient(180deg,rgba(40,103,178,.14) 0%,#FFFFFF 50%,rgba(40,103,178,.10) 100%) padding-box,
             linear-gradient(#FFFFFF,#FFFFFF) padding-box,
             linear-gradient(90deg,#1B4F8C,#2867B2,#6FA3DC) border-box}
.btn.import.li:active{background:linear-gradient(180deg,rgba(40,103,178,.26) 0%,#FFFFFF 50%,rgba(40,103,178,.20) 100%) padding-box,
             linear-gradient(#FFFFFF,#FFFFFF) padding-box,
             linear-gradient(90deg,#1B4F8C,#2867B2,#6FA3DC) border-box}
.btn.import img{height:20px;width:auto}
.btnstack{display:flex;flex-direction:column;gap:10px}
.textbtn{border:0;background:transparent;font-size:16px;font-weight:600;color:var(--wrong);padding:10px;align-self:center}

/* 인물 목록 */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pcard{background:var(--white);border:1px solid var(--line-card);border-radius:14px;padding:18px 10px 16px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.pcard .name{font-weight:700;font-size:17px;margin-top:8px}
.pcard .caption{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.fab{position:fixed;bottom:calc(var(--tabh) + 18px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--point);color:var(--white);display:grid;place-items:center;z-index:5}
.fab svg{width:28px;height:28px}
.empty{text-align:center;color:var(--muted);font-size:15px;padding:40px 12px}
.count{font-size:14px;color:var(--muted)}

/* 등록 */
.photo{width:132px;height:132px;border-radius:14px;border:1.5px dashed var(--line-input);background:var(--white);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:14px;align-self:center;overflow:hidden;padding:0;position:relative}
.photo img,.photo svg{width:100%;height:100%;object-fit:cover;display:block}
.photo .ph-edit{position:absolute;bottom:0;left:0;right:0;background:rgba(26,26,26,.55);color:var(--white);font-size:13px;padding:4px}
.req{color:var(--wrong)}
.err{font-size:14px;color:var(--wrong)}

/* 퀴즈 설정 */
.group{display:flex;flex-direction:column;gap:10px}
.hint{font-size:14px;color:var(--wrong);min-height:21px}

/* 퀴즈 */
.qhead{display:flex;flex-direction:column;gap:10px}
.qmeta{display:flex;align-items:center;justify-content:space-between;gap:8px}
.qnum{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.timer{font-size:18px;font-weight:700;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.timer svg{width:20px;height:20px}
.timer.low{color:var(--wrong)}
.bar{height:6px;border-radius:9999px;background:rgba(26,26,26,.08);overflow:hidden}
.bar i{display:block;height:100%;background:var(--point);border-radius:inherit;transition:width .2s ease-out}
.prompt{display:flex;flex-direction:column;align-items:center;gap:14px;padding:8px 0}
.bigname{font-size:34px;font-weight:700;padding:28px 0 8px}
.qtext{font-size:18px;font-weight:700;text-align:center}
.answers{display:flex;flex-direction:column;gap:16px}
.ansrow{display:flex;align-items:center;gap:8px}
.ansrow .input{flex:1}
.mark{width:28px;flex:none;font-weight:700;font-size:20px;text-align:center}
.mark.ok{color:var(--correct)} .mark.no{color:var(--wrong)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{min-height:48px;border-radius:12px;border:1.5px solid var(--line-input);background:var(--white);font-size:16px;font-weight:500;padding:8px 10px;display:flex;align-items:center;justify-content:center;gap:6px}
.opt[aria-pressed="true"]{border:2px solid var(--point);background:rgba(219,78,24,.07);font-weight:700}
.opt.isright{border:2px solid var(--correct)}
.opt.iswrong{border:2px solid var(--wrong)}
.opt.face{padding:10px;flex-direction:column}
.feedback{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;animation:pop .15s ease-out}
.fb-title{font-size:20px;font-weight:700;display:flex;align-items:center;gap:6px}
.fb-title.ok{color:var(--correct)} .fb-title.no{color:var(--wrong)}
.fb-line{font-size:16px}
.fb-memo{font-size:14px;color:var(--muted)}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}

/* 결과 */
.score{font-size:56px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;text-align:center}
.score .of{color:var(--muted);font-size:32px}
.center{text-align:center}
.wrongrow{display:flex;align-items:center;gap:12px;padding:12px 14px}
.wrongrow .who{flex:1;min-width:0}
.wrongrow .nm{font-weight:700}
.wrongrow .x{color:var(--wrong);font-weight:700;font-size:20px}
.list{display:flex;flex-direction:column;gap:8px}

/* 탭 */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:440px;background:rgba(255,255,255,.94);border-top:1px solid var(--line-card);display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6;backdrop-filter:blur(8px)}
.tab{height:var(--tabh);border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:600;color:var(--tab-off)}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--point)}

/* 토스트·시트 */
.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + 28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--white);font-size:15px;padding:10px 16px;border-radius:12px;z-index:20;max-width:calc(100% - 36px);text-align:center;animation:pop .15s ease-out}
.scrim{position:fixed;inset:0;background:rgba(26,26,26,.4);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--white);width:100%;max-width:440px;border-radius:14px 14px 0 0;padding:24px var(--gutter) calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.sheet h2{font-size:20px;font-weight:700}
.status-pill{align-self:flex-start;font-size:14px;font-weight:600;padding:4px 12px;border-radius:9999px;background:var(--bg-soft);border:1px solid var(--line-card)}
.flow{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;font-size:15px;align-items:center}
.flow b{width:26px;height:26px;border-radius:50%;background:var(--bg-soft);display:grid;place-items:center;font-size:13px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>

const TEAM_ORDER = ["감사1팀","감사2팀","감사3팀","세무1팀","세무2팀","컨설팅팀"];
const ROLE_ORDER = ["스태프","시니어","매니저","파트너"];
const FIELD = {name:"이름", face:"얼굴", team:"소속 팀", role:"직급"};
const KEY = "be-samiliar.v1";
const MASTER_MIN = 2, MASTER_RATE = .8, LOW_RATE = .7;

/* ---------- 저장소 ---------- */
let mem = null;
function load(){
  try{ const s = localStorage.getItem(KEY); if(s) return JSON.parse(s); }catch(e){}
  return mem;
}
function save(){ mem = DB; try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){} }
function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function seed(){
  const today = new Date();
  return {
    persons: SEED.map(p=>({...p, photo:""})),
    studyDays: [1,2,3,4].map(n=>ymd(addDays(today,-n))),
    settings: {mode:"subj", show:"face", ask:["name","team"], teams:[], count:10, time:10},
    lastWrong: []
  };
}
let DB = load() || seed(); save();
const params = new URLSearchParams(location.search);
if(params.has("reset")){ DB = seed(); save(); }

/* ---------- 계산 ---------- */
const rate = p => p.attempts ? p.correct/p.attempts : null;
const isMastered = p => p.attempts>=MASTER_MIN && rate(p)>=MASTER_RATE;
const isLow = p => p.attempts>=1 && rate(p)<LOW_RATE;
const lowList = () => DB.persons.filter(isLow).sort((a,b)=>rate(a)-rate(b)||b.attempts-a.attempts);
function teams(){
  const s = new Set(DB.persons.map(p=>p.team).filter(Boolean));
  return [...TEAM_ORDER.filter(t=>s.has(t)), ...[...s].filter(t=>!TEAM_ORDER.includes(t)).sort()];
}
function roles(){
  const s = new Set(DB.persons.map(p=>p.role).filter(Boolean));
  return [...ROLE_ORDER.filter(t=>s.has(t)), ...[...s].filter(t=>!ROLE_ORDER.includes(t)).sort()];
}
function streak(){
  const set = new Set(DB.studyDays); let d = new Date(); let doneToday = set.has(ymd(d));
  if(!doneToday) d = addDays(d,-1);
  let n=0; while(set.has(ymd(d))){ n++; d=addDays(d,-1); }
  return {n, doneToday};
}

/* ---------- 유틸 ---------- */
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s??"").replace(/\s+/g,"").toLowerCase();
function hasBatchim(w){ const c = String(w).trim().slice(-1).charCodeAt(0); if(c<0xAC00||c>0xD7A3) return false; return (c-0xAC00)%28!==0; }
const iEyo = w => hasBatchim(w) ? "이에요" : "예요";
const eunNeun = w => hasBatchim(w) ? "은" : "는";
const gwaWa = w => hasBatchim(w) ? "과" : "와";
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; };
function hash(s){ let h=2166136261; for(const ch of s){ h^=ch.charCodeAt(0); h=Math.imul(h,16777619);} return h>>>0; }

  return `<svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" fill="${bg}"/>${back}
<path d="M12 104Q12 74 50 71Q88 74 88 104Z" fill="${shirt}"/>

<path d="M45.5 54.5Q50 57.5 54.5 54.5" stroke="#2A2320" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>`;
}
function avatar(p, size){
  const inner = p.photo ? `<img src="${p.photo}" alt="">` : avatarSVG(p.id);
  return `<span class="av" style="width:${size}px;height:${size}px" role="img" aria-label="${esc(p.name)} 얼굴">${inner}</span>`;
}

function render(){

  app.classList.toggle("notab", noTab);

function toast(msg){
  const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.textContent=msg;
  document.querySelectorAll(".toast").forEach(x=>x.remove()); document.body.appendChild(t);

}
function sheet(html, bind){
  layer.innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;

function resizeImage(file, size){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = ()=>{ const img = new Image(); img.onload = ()=>{
      const c=document.createElement("canvas"); c.width=c.height=size; const s=Math.min(img.width,img.height);
      c.getContext("2d").drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,size,size);
      res(c.toDataURL("image/jpeg",.82)); }; img.onerror=rej; img.src=r.result; };
    r.onerror=rej; r.readAsDataURL(file);
  });
}

      else S.ask=["name","face","team","role"].filter(k=>k===v||S.ask.includes(k));
    }
    if(!S.ask.length) S.ask = [S.show==="name"?(S.mode==="mc"?"face":"team"):"name"];
    if(g==="team"){ if(!v) S.teams=[]; else { S.teams = S.teams.includes(v)?S.teams.filter(t=>t!==v):[...S.teams,v]; if(S.teams.length===allTeams.length) S.teams=[]; } }
    if(g==="count") S.count=+v;
    if(g==="time") S.time=+v;
    save(); const y=window.scrollY; view.msg=m; Setup(); window.scrollTo(0,y); view.msg="";
    const again = app.querySelector(`[data-g="${g}"][data-v="${CSS.escape(v)}"]`); again && again.focus();
  });
  const pool = ()=>DB.persons.filter(p=>!S.teams.length||S.teams.includes(p.team));
  document.getElementById("start").onclick = ()=>{
    const P=pool(); if(!P.length){ setHint("대상 팀에 등록한 인물이 없어요"); return; }
    startQuiz(P);
  };
  document.getElementById("focus").onclick = ()=>{
    const P=pool().filter(isLow); if(!P.length){ setHint("아직 다시 확인할 사람이 없어요. 퀴즈를 먼저 풀어 보세요"); return; }
    startQuiz(P);
  };
}
function setHint(t){ const h=document.getElementById("hint"); h.textContent=t; h.scrollIntoView({block:"center",behavior:"smooth"}); }

/* ========== ⑤ 퀴즈 ========== */
let timerId=null;
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }
function startQuiz(pool){
  const S = {...DB.settings, ask:[...DB.settings.ask]};
  const people = shuffle(pool).slice(0, Math.min(S.count, pool.length));
  Q = {S, people, i:0, results:[], started:Date.now(), pool};
  go("quiz");
}
function buildOptions(p, k){
  const others = shuffle(DB.persons.filter(x=>x.id!==p.id));
  if(k==="name"){ const names=[...new Set(others.map(x=>x.name))].filter(n=>n!==p.name).slice(0,3); return shuffle([p.name,...names]).map(v=>({v,label:v})); }
  if(k==="face"){ return shuffle([p,...others.slice(0,3)]).map(x=>({v:x.id,label:x.name,person:x})); }
  const all = k==="team"?teams():roles(); const rest = shuffle(all.filter(v=>v!==p[k])).slice(0,3);
  return shuffle([p[k],...rest].filter(Boolean)).map(v=>({v,label:v}));
}
function qText(ask){
  if(ask.length===1 && ask[0]==="face") return "이 이름의 얼굴은?";
  const w = ask.map(k=>FIELD[k]);
  const last = w[w.length-1];
  const head = w.length===1 ? "" : w.length===2 ? w[0]+gwaWa(w[0])+" " : w.slice(0,-1).join(", ")+", ";
  return head + last + eunNeun(last) + "?";
}
function Quiz(){
  const {S, people, i} = Q; const p = people[i];
  if(!Q.cur || Q.cur.id!==p.id+i){
    Q.cur = {id:p.id+i, answered:false, picks:{}, opts:{}};
    if(S.mode==="mc") S.ask.forEach(k=>Q.cur.opts[k]=buildOptions(p,k));
  }
  const cur = Q.cur, total = people.length;
  const promptHTML = S.show==="face" ? avatar(p,168) : `<p class="bigname">${esc(p.name)}</p>`;
  let ans = "";
  if(S.mode==="subj"){
    ans = S.ask.map(k=>{
      const ph = k==="name"?"이름을 입력하세요":k==="team"?"팀을 입력하세요":"직급을 입력하세요";
      const r = cur.answered ? cur.marks[k] : null;
      return `<div class="field"><label class="label" for="a-${k}">${FIELD[k]}</label><div class="ansrow">
        <input class="input" id="a-${k}" data-k="${k}" placeholder="${ph}" autocomplete="off" value="${esc(cur.picks[k]||"")}" ${cur.answered?"readonly":""}>
        ${r===null?"":`<span class="mark ${r?"ok":"no"}" aria-label="${r?"정답":"오답"}">${r?"✓":"✗"}</span>`}</div></div>`;
    }).join("");
  } else {
    ans = S.ask.map(k=>`<div class="group"><p class="label">${FIELD[k]}</p><div class="opts" role="group" aria-label="${FIELD[k]} 보기">${
      cur.opts[k].map(o=>{
        const picked = cur.picks[k]===o.v; let cls="";
        const right = k==="face" ? o.v===p.id : o.v===p[k];
        if(cur.answered){ if(right) cls="isright"; else if(picked) cls="iswrong"; }
        const mark = cur.answered && (right||picked) ? `<span class="mark ${right?"ok":"no"}" style="width:auto">${right?"✓":"✗"}</span>` : "";
        return `<button class="opt ${k==="face"?"face":""} ${cls}" data-k="${k}" data-v="${esc(o.v)}" aria-pressed="${picked}" ${cur.answered?"disabled":""}>${k==="face"?avatar(o.person,72):esc(o.label)}${mark}</button>`;
      }).join("")}</div></div>`).join("");
  }
  let fb = "";
  if(cur.answered){
    const line = `${esc(p.name)} · ${esc(p.team)} ${esc(p.role)}`;
    fb = cur.correct
      ? `<div class="feedback" role="status"><p class="fb-title ok">✓ 정답이에요</p><p class="fb-line">${line}</p>${p.memo?`<p class="fb-memo">${esc(p.memo)}</p>`:""}</div>`
      : `<div class="feedback" role="status"><p class="fb-title no">✗ ${cur.timeout?"시간이 지났어요":"오답이에요"}</p><p class="fb-line">정답은 ${line}${iEyo(p.role||p.team||p.name)}</p>${p.memo?`<p class="fb-memo">${esc(p.memo)}</p>`:""}</div>`;
  }
  const last = i===total-1;
  app.innerHTML = `<div class="screen" style="gap:20px">
    <div class="qhead">
      <div class="qmeta"><button class="iconbtn" id="quit" aria-label="퀴즈 그만하기">${I.close}</button>
        <span class="qnum">${i+1}/${total}</span>
        <span class="timer" id="timer" ${S.time?"":"hidden"}>${I.clock}<span id="tsec">${S.time}초</span></span>${S.time?"":`<span style="width:44px"></span>`}</div>
      <div class="bar"><i style="width:${(i/total)*100}%" id="bar"></i></div>
    </div>
    <div class="prompt">${promptHTML}<p class="qtext">${qText(S.ask)}</p></div>
    <form class="answers" id="form" novalidate>${ans}${fb}
      <button class="btn primary" id="submit" type="submit">${cur.answered?(last?"결과 보기":"다음"):"제출"}</button>
    </form>
  </div>`;
  requestAnimationFrame(()=>{ const b=document.getElementById("bar"); if(b) b.style.width=((i+(cur.answered?1:0))/total*100)+"%"; });
  const form = document.getElementById("form");
  form.addEventListener("submit", e=>{ e.preventDefault(); if(cur.answered){ next(); } else submit(false); });
  form.addEventListener("input", e=>{ if(e.target.dataset.k) cur.picks[e.target.dataset.k]=e.target.value; });
  form.addEventListener("click", e=>{ const o=e.target.closest(".opt"); if(!o||cur.answered) return; cur.picks[o.dataset.k]=o.dataset.v;
    o.parentElement.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-pressed", x===o)); });
  document.getElementById("quit").onclick = ()=>sheet(`<h2>퀴즈를 그만할까요?</h2><p class="caption">지금까지 푼 문제는 기록돼요</p><div class="row2"><button class="btn" id="cont">계속하기</button><button class="btn primary" id="stop">그만하기</button></div>`, s=>{
    s.querySelector("#cont").onclick=closeSheet;
    s.querySelector("#stop").onclick=()=>{ closeSheet(); Q.people=Q.people.slice(0,Q.results.length); if(Q.results.length) go("result"); else go("setup"); };
  });
  if(!cur.answered){
    const first = form.querySelector("input"); if(first) first.focus({preventScroll:true});
    if(S.time){
      const end = cur.deadline || (cur.deadline = Date.now()+S.time*1000);
      const tick = ()=>{ const left=Math.max(0,Math.ceil((end-Date.now())/1000)); const t=document.getElementById("tsec"); if(t){ t.textContent=left+"초"; document.getElementById("timer").classList.toggle("low", left<=3); }
        if(left<=0){ submit(true); } };
      stopTimer(); tick(); timerId=setInterval(tick,200);
    }
  } else document.getElementById("submit").focus({preventScroll:true});
}
function check(p,k,val){
  const a = norm(val); if(!a) return false;
  if(k==="name") return a.includes(norm(p.name));
  if(k==="team") return a===norm(p.team) || a+"팀"===norm(p.team);
  if(k==="role") return a===norm(p.role);
  if(k==="face") return val===p.id;
  return false;
}
function submit(timeout){
  stopTimer();
  const cur=Q.cur, p=Q.people[Q.i];
  if(!timeout && Q.S.mode==="mc" && Q.S.ask.some(k=>!cur.picks[k])){ toast("보기를 선택하세요"); if(Q.S.time) Quiz(); return; }
  cur.marks = {}; Q.S.ask.forEach(k=>cur.marks[k] = !timeout && check(p,k,cur.picks[k]));
  cur.correct = !timeout && Q.S.ask.every(k=>cur.marks[k]);
  cur.timeout = timeout; cur.answered = true;
  const person = DB.persons.find(x=>x.id===p.id);
  if(person){ person.attempts++; if(cur.correct) person.correct++; }
  const today = ymd(new Date()); if(!DB.studyDays.includes(today)) DB.studyDays.push(today);
  Q.results.push({id:p.id, ok:cur.correct});
  save(); Quiz();
}
function next(){ if(Q.i < Q.people.length-1){ Q.i++; Quiz(); } else { Q.ended=Date.now(); go("result"); } }

/* ========== ⑥ 결과 ========== */
function Result(){
  const total = Q.results.length, ok = Q.results.filter(r=>r.ok).length;
  const sec = Math.round(((Q.ended||Date.now())-Q.started)/1000);
  const wrong = Q.results.filter(r=>!r.ok).map(r=>DB.persons.find(p=>p.id===r.id)||Q.people.find(p=>p.id===r.id)).filter(Boolean);
  DB.lastWrong = wrong.map(p=>p.id); save();
  const line = ok===total ? "모두 맞히셨어요!" : ok/total>=.8 ? "거의 다 기억하고 계시네요" : "틀린 사람을 한 번 더 확인해 보세요";
  app.innerHTML = `<div class="screen">
    <h1 class="h-screen">결과</h1>
    <div style="display:flex;flex-direction:column;gap:10px;align-items:center;padding:8px 0">
      <p class="score">${ok}<span class="of"> / ${total}</span></p>
      <p class="caption">소요 시간 ${Math.floor(sec/60)}분 ${sec%60}초</p>
      <p style="font-size:18px;font-weight:700">${line}</p>
    </div>
    <section class="group"><p class="label">다시 확인할 사람</p>
      ${wrong.length ? `<div class="list">${wrong.map(p=>`<div class="card wrongrow">${avatar(p,48)}<div class="who"><p class="nm">${esc(p.name)}</p><p class="caption">${esc(p.team)} ${esc(p.role)}</p></div><span class="x" aria-label="오답">✗</span></div>`).join("")}</div>`
        : `<p class="caption">다시 확인할 사람이 없어요</p>`}
    </section>
    <div class="btnstack">
      <button class="btn" id="retry" ${wrong.length?"":"disabled"}>틀린 사람 다시 풀기</button>
      <button class="btn primary" id="home">홈으로</button>
    </div>
  </div>`;
  document.getElementById("retry").onclick = ()=>{ const S=Q.S; const P=wrong; Q={S,people:shuffle(P),i:0,results:[],started:Date.now()}; go("quiz"); };
  document.getElementById("home").onclick = ()=>go("home");
}

render();
</script>
